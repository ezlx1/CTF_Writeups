<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="tvglow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#eaf6ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8fd3ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8fd3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireglow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="textBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="1000" height="500" fill="#121a2e"/>
  <g stroke="#1b2847" stroke-width="2" opacity="0.5">
    <line x1="60" y1="0" x2="60" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="260" y1="0" x2="260" y2="500"/>
    <line x1="360" y1="0" x2="360" y2="500"/>
    <line x1="460" y1="0" x2="460" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="660" y1="0" x2="660" y2="500"/>
    <line x1="760" y1="0" x2="760" y2="500"/>
    <line x1="860" y1="0" x2="860" y2="500"/>
    <line x1="960" y1="0" x2="960" y2="500"/>
  </g>
  <rect x="0" y="0" width="1000" height="6" fill="#39ff14" opacity="0.5"/>

  <!-- floor -->
  <rect x="0" y="500" width="1000" height="60" fill="#2a1d14"/>
  <g stroke="#1d130c" stroke-width="2" opacity="0.6">
    <line x1="0" y1="518" x2="1000" y2="518"/>
    <line x1="0" y1="538" x2="1000" y2="538"/>
  </g>

  <!-- name header -->
  <g text-anchor="middle">
    <text x="500" y="54" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="bold"
          letter-spacing="5" fill="#39ff14" opacity="0.5" filter="url(#textBlur)">&lt;AWS_ALEDWAN/&gt;</text>
    <text x="500" y="54" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="bold"
          letter-spacing="5" fill="#eafff0">&lt;AWS_ALEDWAN/&gt;</text>
    <rect x="378" y="64" width="244" height="3" fill="#39ff14">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ambient glow behind the TV -->
  <ellipse cx="483" cy="210" rx="260" ry="190" fill="url(#tvglow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================= TV (live terminal readout) ================= -->
  <g>
    <rect x="344" y="84" width="280" height="230" rx="10" fill="#0b0e14" stroke="#39ff14" stroke-width="3"/>
    <rect x="356" y="96" width="256" height="180" fill="#05070a"/>
    <!-- TVLOG:START -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#39ff14">
      <text x="364" y="118">CTF_Writeups: Rubber Stamp</text>
      <text x="364" y="136">CTF_Writeups: Rubber Stamp</text>
      <text x="364" y="154">CTF_Writeups: Python Playground</text>
      <text x="364" y="172">CTF_Writeups: Python Playground</text>
      <text x="364" y="190">CTF_Writeups: Python Playground</text>
      <text x="364" y="214" fill="#eafff0">$ git log --oneline</text>
      <rect x="524" y="203" width="8" height="14" fill="#eafff0">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- TVLOG:END -->
    <rect x="356" y="96" width="256" height="180" fill="none" stroke="#1b2a1b" stroke-width="1"/>
    <circle cx="372" cy="288" r="5" fill="#1b2a1b"/>
    <circle cx="390" cy="288" r="5" fill="#1b2a1b"/>
    <circle cx="408" cy="288" r="5" fill="#1b2a1b"/>
  </g>

  <!-- ================= fireplace ================= -->
  <g>
    <rect x="323" y="364" width="315" height="150" rx="6" fill="#2a2320" stroke="#1a1512" stroke-width="3"/>
    <rect x="345" y="384" width="271" height="110" fill="#0a0604"/>
    <ellipse cx="480" cy="494" rx="200" ry="70" fill="url(#fireglow)">
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="1.6s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M460,494 C450,460 470,445 462,420 C480,432 492,450 486,470 C500,458 504,440 498,422 C516,440 518,468 500,494 Z" fill="#ff5a1f">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <path d="M500,494 C494,470 508,458 502,438 C516,448 524,462 518,478 C530,470 532,456 526,442 C540,456 541,476 528,494 Z" fill="#ffb13d">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <rect x="420" y="486" width="120" height="8" fill="#140d08"/>
  </g>

  <!-- ================= left shelf (3 slots) — stone tone to match fireplace ================= -->
  <g>
    <rect x="10" y="20" width="300" height="470" rx="6" fill="#2a2320" stroke="#1a1512" stroke-width="3"/>
    <!-- slot 1: assets/clips/shelf-left-1.gif -->
    <rect x="26" y="36" width="268" height="138" fill="#05070a" stroke="#1a1512" stroke-width="1"/>
    <image href="clips/shelf-left-1.gif" xlink:href="clips/shelf-left-1.gif" x="26" y="36" width="268" height="138" preserveAspectRatio="xMidYMid meet"/>
    <rect x="26" y="182" width="268" height="10" fill="#4a3625"/>
    <text x="160" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a7a6a">clips/shelf-left-1.gif</text>

    <!-- slot 2: assets/clips/shelf-left-2.gif -->
    <rect x="26" y="208" width="268" height="138" fill="#05070a" stroke="#1a1512" stroke-width="1"/>
    <image href="clips/shelf-left-2.gif" xlink:href="clips/shelf-left-2.gif" x="26" y="208" width="268" height="138" preserveAspectRatio="xMidYMid meet"/>
    <rect x="26" y="354" width="268" height="10" fill="#4a3625"/>
    <text x="160" y="362" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a7a6a">clips/shelf-left-2.gif</text>

    <!-- slot 3: assets/clips/shelf-left-3.gif -->
    <rect x="26" y="380" width="268" height="100" fill="#05070a" stroke="#1a1512" stroke-width="1"/>
    <image href="clips/shelf-left-3.gif" xlink:href="clips/shelf-left-3.gif" x="26" y="380" width="268" height="100" preserveAspectRatio="xMidYMid meet"/>
    <text x="160" y="498" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a7a6a">clips/shelf-left-3.gif</text>
  </g>

  <!-- ================= right shelf (3 slots) — stone tone to match fireplace ================= -->
  <g>
    <rect x="690" y="20" width="300" height="470" rx="6" fill="#2a2320" stroke="#1a1512" stroke-width="3"/>
    <!-- slot 1: assets/clips/shelf-right-1.gif -->
    <rect x="706" y="36" width="268" height="138" fill="#05070a" stroke="#1a1512" stroke-width="1"/>
    <image href="clips/shelf-right-1.gif" xlink:href="clips/shelf-right-1.gif" x="706" y="36" width="268" height="138" preserveAspectRatio="xMidYMid meet"/>
    <rect x="706" y="182" width="268" height="10" fill="#4a3625"/>
    <text x="840" y="190" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a7a6a">clips/shelf-right-1.gif</text>

    <!-- slot 2: assets/clips/shelf-right-2.gif -->
    <rect x="706" y="208" width="268" height="138" fill="#05070a" stroke="#1a1512" stroke-width="1"/>
    <image href="clips/shelf-right-2.gif" xlink:href="clips/shelf-right-2.gif" x="706" y="208" width="268" height="138" preserveAspectRatio="xMidYMid meet"/>
    <rect x="706" y="354" width="268" height="10" fill="#4a3625"/>
    <text x="840" y="362" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a7a6a">clips/shelf-right-2.gif</text>

    <!-- slot 3: assets/clips/shelf-right-3.gif -->
    <rect x="706" y="380" width="268" height="100" fill="#05070a" stroke="#1a1512" stroke-width="1"/>
    <image href="clips/shelf-right-3.gif" xlink:href="clips/shelf-right-3.gif" x="706" y="380" width="268" height="100" preserveAspectRatio="xMidYMid meet"/>
    <text x="840" y="498" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a7a6a">clips/shelf-right-3.gif</text>
  </g>

  <rect x="0" y="554" width="1000" height="6" fill="#39ff14" opacity="0.5"/>
</svg>
